<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CashWeave conversation verification</title><link rel="stylesheet" href="/src/styles.css"><link rel="stylesheet" href="/src/clarity.css"><link rel="stylesheet" href="/src/knowledge.css"><link rel="stylesheet" href="/src/chat.css"></head><body>
<div id="tradeflow-export-preview" data-page="assistant"><header class="tf-top"><strong>↗ CashWeave</strong><small>UI test · scripted events · no model calls</small></header><main class="tf-main" style="margin:auto"><div id="tf-content"><section class="tx-chat"><div class="tx-chat-top"><span>TF-26104 · Harbour Supplies</span><button id="language" class="tf-link">中文 / English</button></div><div class="tx-messages" id="messages"></div><div class="tx-composer"><div class="kb-context">↳ Order documents</div><form id="tf-ai-form"><textarea id="tf-ai-question" aria-label="Ask CashWeave" rows="1"></textarea><div class="tx-send-row"><span class="tf-note"></span><button class="tf-button primary" type="button" data-action="ai-submit">Send</button></div></form></div></section></div><footer style="display:flex;gap:16px;margin-top:24px;flex-wrap:wrap"><button id="scroll-check">Verify history scroll</button><button id="advance">Next activity</button><button id="finish">Complete response</button><button id="complete-while-typing">Complete while typing</button><output id="checks"></output></footer></main></div>
<script type="module">
import {setupChat,replaceChatReply,rememberChatScroll} from '/src/chat-ui.js';
import {createKnowledgeUI} from '/src/knowledge.js';
const root=document.querySelector('#tradeflow-export-preview');
let lang='en';
const trace=[{event:'agent_started',agent:'coordinator'},{event:'model_started',agent:'coordinator'}];
const turn={id:'preview',question:'The buyer can only pay part of the balance. How does this affect our cash?',rag:{status:'pending',progress:{status:'running',trace}}};
const ui=createKnowledgeUI({root,language:()=>lang,order:()=>'',selectedDocument:()=>'',selectDocument:()=>{},rerender:()=>{}});
const markup=()=>`<div class="tx-chat-user">${turn.question}</div><div class="tx-chat-reply" data-reply-id="preview" data-chat-status="${turn.rag.status}"><span class="sx-eyebrow">CashWeave</span>${ui.answer(turn)}</div>`;
const history = Array.from({length:8}, (_,i) => `<div class="tx-chat-user">${i+1}. Review the order payment schedule.</div><div class="tx-chat-reply" data-reply-id="history-${i}" data-chat-status="done"><span class="sx-eyebrow">CashWeave</span><p>The supplier payment is due before the expected buyer receipt. Confirm the payment dates before changing the forecast.</p></div>`).join('');
document.querySelector('#messages').innerHTML=history+markup();setupChat(root,lang);
const finish=()=>{
 turn.rag={status:'done',mode:'multi_agent',task_status:'completed',trace:[...trace,{event:'tool_result',agent:'cash_flow',tool:'wf_cash'}],sources:[],paragraphs:[{text:lang==='en'?'Your current plan leaves a CNY 32,000 shortfall on 22 October. The buyer’s receipt is expected on 29 October, seven days after the supplier payment.':'当前安排下，10 月 22 日存在人民币 32,000 元的缺口。客户预计 10 月 29 日付款，比供应商付款日晚七天。',sources:[]},{text:lang==='en'?'The next step is to confirm how much the buyer can pay before 22 October. I can help prepare that request; the cash forecast stays unchanged until you confirm a new payment arrangement.':'下一步是确认客户能否在 10 月 22 日前支付部分款项。我可以协助准备询问邮件；确认新安排前，资金预测保持不变。',sources:[]}]};
 replaceChatReply(root,turn,markup(),lang);
};
document.querySelector('#advance').onclick=()=>{
 const disclosure=root.querySelector('.kb-progress');const indicator=root.querySelector('.kb-progress-indicator');const row=root.querySelector('.kb-progress-step');const open=disclosure.open;
 trace.push({event:'model_call',agent:'coordinator'},{event:'agent_started',agent:'cash_flow'},{event:'tool_started',agent:'cash_flow',tool:'wf_cash'});ui.updateProgress(turn);
 document.querySelector('#checks').textContent=disclosure===root.querySelector('.kb-progress')&&indicator===root.querySelector('.kb-progress-indicator')&&row===root.querySelector('.kb-progress-step')&&disclosure.open===open?'PASS · Activity nodes and disclosure retained':'FAIL';
};
document.querySelector('#finish').onclick=finish;
document.querySelector('#complete-while-typing').onclick=()=>{
 const input=root.querySelector('textarea');input.value='Keep this unsent question';input.focus();input.setSelectionRange(5,9);finish();
 document.querySelector('#checks').textContent=document.activeElement===input&&input.value==='Keep this unsent question'&&input.selectionStart===5&&input.selectionEnd===9?'PASS · Input, focus and selection retained':'FAIL';
};
document.querySelector('#language').onclick=()=>{rememberChatScroll(root);lang=lang==='en'?'zh':'en';const panel=root.querySelector('.tx-messages');const next=panel.cloneNode(false);next.removeAttribute('data-scroll-key');next.innerHTML=history+markup();panel.replaceWith(next);setupChat(root,lang);};
document.querySelector('#scroll-check').onclick=()=>{
 const panel=root.querySelector('.tx-messages');
 panel.scrollTop=100;
 const top=panel.scrollTop;
 const composerTop=root.querySelector('.tx-composer').getBoundingClientRect().top;
 finish();
 requestAnimationFrame(()=>{
  const stable=panel.scrollTop===top&&root.querySelector('.tx-composer').getBoundingClientRect().top===composerTop;
  const scrollable=panel.scrollHeight>panel.clientHeight&&document.documentElement.scrollHeight<=innerHeight+1;
  document.querySelector('#checks').textContent=stable&&scrollable&&panel.querySelectorAll('[data-reply-id]').length===9?'PASS · 9 replies visible, independent scroll, reading position and composer retained':'FAIL · Scroll layout';
 });
};
document.querySelector('[data-action="ai-submit"]').onclick=()=>{document.querySelector('#checks').textContent='PASS · Enter sends one message';};
</script></body></html>
