<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="CashWeave connects documents, export orders, cash planning and AI-assisted follow-up for small export businesses."
    />
    <title>CashWeave · Export Finance Workspace</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <link rel="stylesheet" href="/src/clarity.css" />
    <link rel="stylesheet" href="/src/knowledge.css" />
    <link rel="stylesheet" href="/src/chat.css" />
    <link rel="stylesheet" href="/src/business.css" />
    <script type="module" src="/src/bootstrap.js"></script>
  </head>
  <body>
    <div
      id="tradeflow-export-preview"
      lang="zh-CN"
      aria-label="CashWeave 小微出口企业财务工作台"
    >
      <p role="status">Loading CashWeave…</p>
      <template id="legacy-workspace">
      <header class="tf-top">
        <div class="tf-brand"><span class="tf-logo">↗</span>CashWeave</div>
        <div class="tf-company">
          星帆出口贸易<span class="tf-small"> · 深圳</span>
        </div>
        <span class="tf-sample">模拟企业 · 交互预览</span>
        <div
          class="tf-languages"
          data-language-control
          role="group"
          aria-label="Language / 语言"
        >
          <button type="button" data-language="zh" aria-pressed="true">
            中文</button
          ><button type="button" data-language="en" aria-pressed="false">
            English
          </button>
        </div>
        <div id="tx-notification-control"></div>
      </header>
      <aside id="tx-notification-panel" class="nt-panel" tabindex="-1" aria-label="Notifications" hidden></aside>
      <div class="tf-shell">
        <nav class="tf-nav" aria-label="主要功能">
          <button type="button" data-page="overview" aria-current="page">
            <i data-lucide="layout-dashboard" aria-hidden="true"></i>订单工作台
          </button>
          <button type="button" data-page="assistant">
            <i data-lucide="sparkles" aria-hidden="true"></i>AI 助手
          </button>
          <button type="button" data-page="orders">
            <i data-lucide="package" aria-hidden="true"></i>出口订单
          </button>
          <div class="tf-navfooter">
            让订单回款<br />赶上经营付款。
            <div style="margin-top: 12px">演示身份：企业负责人</div>
          </div>
        </nav>
        <main class="tf-main">
          <div class="tf-heading">
            <div>
              <h2 id="tf-page-title">今天，先关注资金安排</h2>
              <p id="tf-page-sub">围绕出口订单，掌握收款进度与近期支出。</p>
            </div>
          </div>
          <div id="tx-case-ribbon"></div>
          <div class="tf-layout">
            <div class="tf-content" id="tf-content"></div>
          </div>
        </main>
      </div>
      <aside id="tx-agent-tasks" class="tx-agent-tasks" data-user-content></aside>
      <div class="tf-toast" id="tf-toast" role="status" hidden></div>
      </template>
    </div>
  </body>
</html>
