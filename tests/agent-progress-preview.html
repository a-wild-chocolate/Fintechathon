<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TradeX activity UI test</title><link rel="stylesheet" href="/src/styles.css"><link rel="stylesheet" href="/src/clarity.css"><link rel="stylesheet" href="/src/knowledge.css"></head><body><main id="tradeflow-export-preview" style="max-width:800px;margin:40px auto;padding:24px"><p class="tf-small">UI verification · replayed events · no model calls</p><h2 style="margin:24px 0">TradeX activity</h2><div id="activity"></div><button id="advance" class="tf-button">Next event</button><p id="check" role="status" style="margin-top:20px"></p><script type="module">
import {renderAgentProgress,updateAgentProgress} from '/src/agent-progress.js';
const batches = [
 [{event:'agent_started',agent:'coordinator'},{event:'model_started',agent:'coordinator'}],
 [{event:'model_call',agent:'coordinator'},{event:'tool_started',agent:'coordinator',tool:'wf_status'},{event:'tool_result',agent:'coordinator',tool:'wf_status'},{event:'model_started',agent:'coordinator'}],
 [{event:'model_call',agent:'coordinator'},{event:'agent_started',agent:'cash_flow'},{event:'tool_started',agent:'cash_flow',tool:'wf_cash'}],
 [{event:'tool_result',agent:'cash_flow',tool:'wf_cash'},{event:'agent_finished',agent:'cash_flow'},{event:'model_started',agent:'coordinator'}],
];
let index=0,trace=[...batches[0]];
const container=document.querySelector('#activity');container.innerHTML=renderAgentProgress({trace},'en');
document.querySelector('#advance').onclick=()=>{
 const indicator=container.querySelector('.kb-progress-indicator');
 const disclosure=container.querySelector('details');const open=disclosure.open;
 index=(index+1)%batches.length;trace=index ? [...trace,...batches[index]] : [...batches[0]];
 updateAgentProgress(container,{trace},'en');
 const stable=indicator===container.querySelector('.kb-progress-indicator') && disclosure===container.querySelector('details') && disclosure.open===open;
 document.querySelector('#check').textContent=stable ? 'PASS · Indicator retained; activity disclosure preserved.' : 'FAIL · Progress UI was replaced.';
};
</script></main></body></html>
