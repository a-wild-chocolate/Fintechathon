[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "tradex-rag"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["qdrant-client==1.19.1", "fastembed==0.9.0", "fastapi==0.143.3", "uvicorn==0.54.0", "python-multipart==0.0.32", "mcp==2.3.0", "httpx==0.28.1", "pypdf>=6", "lxml>=6", "python-docx>=1.2", "openpyxl>=3.1"]
[project.optional-dependencies]
test = ["pytest==9.1.1"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[tool.setuptools.packages.find]
include = ["tradex_rag*"]
[tool.setuptools.package-data]
tradex_rag = ["workbench.html"]
